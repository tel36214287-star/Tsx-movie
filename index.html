    <style>
      /* Custom CSS for Fire Letter Effect (Labaredas) */
      .text-fire-glow {
        color: #FFFAEC; /* Almost white, for the hottest core of the flame */
        text-shadow:
          0 0 8px rgba(255, 230, 0, 0.8),   /* Bright yellow core glow */
          0 0 15px rgba(255, 165, 0, 0.7),  /* Orange glow */
          0 0 25px rgba(255, 69, 0, 0.6),   /* Red-orange glow */
          0 0 40px rgba(139, 0, 0, 0.4),    /* Dark red outer glow */
          0 0 60px rgba(255, 0, 0, 0.2);    /* Faintest, widest red glow */
        transition: all 0.4s ease-in-out; /* Slightly longer transition for a smoother effect */
      }

      .text-fire-glow:hover {
        color: #FFFFFF; /* Pure white on hover for maximum intensity */
        text-shadow:
          0 0 10px rgba(255, 255, 0, 1),    /* Intense bright yellow */
          0 0 20px rgba(255, 140, 0, 0.9),  /* Intense orange */
          0 0 35px rgba(255, 0, 0, 0.8),    /* Intense red */
          0 0 50px rgba(178, 34, 34, 0.6),  /* Deeper red */
          0 0 70px rgba(255, 0, 0, 0.4),    /* Very wide red spread */
          0 0 90px rgba(255, 0, 0, 0.2);    /* Farthest, largest red spread */
      }
    </style>
